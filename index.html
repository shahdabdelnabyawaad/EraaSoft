<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Performance Dashboard</title>
    <!-- Tajawal Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-navy: #0E2A66;
            --brand-cyan: #00A8CC;
            --brand-bg: #0B132B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--brand-bg);
        }

        /* 1. COVER PAGE CONTAINER WITH BACKGROUND IMAGE */
        .cover-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* الصورة الثانية المختارة كخلفية للغلاف */
            background: url('https://images.unsplash.com/photo-1576602976047-174e57a47881?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            animation: fadeInCover 1s ease-in-out 2.5s forwards; 
        } 
 
        /* Dark Overlay over background for contrast */ 
        .cover-overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(11, 19, 43, 0.75); 
            backdrop-filter: blur(4px); 
        } 
 
        /* 2. CENTER TITLE */ 
        .main-title-box { 
            position: relative; 
            z-index: 5; 
            text-align: center; 
            padding: 30px 50px; 
            background: rgba(28, 37, 65, 0.65); 
            border: 1px solid rgba(0, 168, 204, 0.3); 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            backdrop-filter: blur(10px); 
        } 
 
        .main-title-box h1 { 
            font-size: 3.5rem; 
            font-weight: 900; 
            background: linear-gradient(135deg, #FFFFFF 30%, var(--brand-cyan)); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 1.5px; 
            margin-bottom: 10px; 
            text-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        } 
 
        .main-title-box p { 
            font-size: 1.2rem; 
            color: #8D99AE; 
            font-weight: 600; 
        } 
 
        /* 3. LOGOS POSITIONS */ 
        .logo-box { 
            position: absolute; 
            z-index: 10; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px 18px; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 14px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); 
        } 
 
        .logo-box img { 
            height: 45px; 
            width: auto; 
            object-fit: contain; 
        } 
 
        /* iCareer - Top Right */ 
        .logo-icareer { 
            top: 35px; 
            right: 40px; 
            opacity: 0; 
            animation: fadeInCorner 0.8s ease-in-out 2.8s forwards; 
        } 
 
        /* Digitera - Bottom Left */ 
        .logo-digitera { 
            bottom: 35px; 
            left: 40px; 
            opacity: 0; 
            animation: fadeInCorner 0.8s ease-in-out 3s forwards; 
        } 
 
        /* 4. ANIMATED ERASOFT INTRO OVERLAY */ 
        #intro-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: #050a18; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
            animation: fadeOutOverlay 0.6s ease-in-out 2.4s forwards; 
        } 
 
        .erasoft-animated-logo { 
            position: absolute; 
            padding: 12px 22px; 
            background: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 0 40px rgba(0, 168, 204, 0.5); 
            animation: erasoftMove 1.8s cubic-bezier(0.77, 0, 0.175, 1) 0.6s forwards; 
        } 
 
        .erasoft-animated-logo img { 
            height: 60px; 
            width: auto; 
            display: block; 
        } 
 
        /* KEYFRAME ANIMATIONS */ 
 
        /* EraSoft Starting in Center, then sliding to Top-Left */ 
        @keyframes erasoftMove { 
            0% { 
                transform: translate(0, 0) scale(1.4); 
            } 
            100% { 
                /* الانتقال لأعلى اليسار وتحجيم الحجم */ 
                transform: translate(calc(-50vw + 120px), calc(-50vh + 65px)) scale(0.75); 
            } 
        } 
 
        @keyframes fadeOutOverlay { 
            to { 
                opacity: 0; 
                visibility: hidden; 
            } 
        } 
 
        @keyframes fadeInCover { 
            to { 
                opacity: 1; 
            } 
        } 
 
        @keyframes fadeInCorner { 
            to { 
                opacity: 1; 
            } 
        } 
 
        @media (max-width: 768px) { 
            .main-title-box h1 { font-size: 2.2rem; } 
            .logo-box img { height: 32px; } 
            .logo-icareer { top: 20px; right: 20px; } 
            .logo-digitera { bottom: 20px; left: 20px; } 
        } 
    </style> 
</head> 
<body> 
 
    <!-- Intro Layer with Animated EraSoft Logo --> 
    <div id="intro-overlay"> 
        <div class="erasoft-animated-logo"> 
            <!-- EraSoft Logo --> 
            <img src="Logo EraaSoft.webp" alt="EraSoft Logo"> 
        </div> 
    </div> 
 
    <!-- Main Cover Page Container --> 
    <div class="cover-container"> 
        <div class="cover-overlay"></div> 
 
        <!-- iCareer Logo (Top Right) --> 
        <div class="logo-box logo-icareer"> 
            <img src="Logo icareer.webp" alt="iCareer Logo"> 
        </div> 
 
        <!-- Digitera Logo (Bottom Left) --> 
        <div class="logo-box logo-digitera"> 
            <img src="Logo Digitera.png" alt="Digitera Logo"> 
        </div> 
 
        <!-- Center Main Title --> 
        <div class="main-title-box"> 
            <h1>Pharmacy Performance Dashboard</h1> 
            <p>Advanced Analytics & Executive Performance Overview</p> 
        </div> 
    </div> 
 
</body> 
</html>
