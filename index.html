```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pharmacy Performance Dashboard</title>

    <!-- Tajawal Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --brand-navy: #0E2A66;
            --brand-cyan: #00A8CC;
            --brand-bg: #0B132B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--brand-bg);
        }


        /* =====================================================
           MAIN COVER
        ===================================================== */

        .cover-container {

            position: relative;

            width: 100%;
            height: 100vh;

            background-image:
                url('https://images.unsplash.com/photo-1576602976047-174e57a47881?q=80&w=1600&auto=format&fit=crop');

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;

            animation:
                fadeInCover
                1s
                ease-in-out
                2.5s
                forwards;
        }


        /* =====================================================
           BACKGROUND OVERLAY
        ===================================================== */

        .cover-overlay {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(11, 19, 43, 0.30);

            z-index: 1;
        }


        /* =====================================================
           MAIN TITLE BOX
        ===================================================== */

        .main-title-box {

            position: relative;

            z-index: 5;

            text-align: center;

            padding: 16px 26px;

            width: fit-content;

            max-width: 90%;

            background: rgba(11, 19, 43, 0.70);

            border: 1px solid rgba(0, 168, 204, 0.45);

            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.30);

            backdrop-filter: blur(5px);
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .main-title-box h1 {

            font-size: 2.3rem;

            font-weight: 900;

            white-space: nowrap;

            background:
                linear-gradient(
                    135deg,
                    #FFFFFF 30%,
                    var(--brand-cyan)
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            letter-spacing: 0.8px;

            margin: 0;
        }


        /* =====================================================
           iCAREER + DIGITERA LOGOS
        ===================================================== */

        .logo-box {

            position: absolute;

            z-index: 20;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 9px 16px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 13px;

            box-shadow:
                0 7px 20px rgba(0, 0, 0, 0.30);
        }


        .logo-box img {

            height: 42px;

            width: auto;

            object-fit: contain;

            display: block;
        }


        /* =====================================================
           iCAREER - TOP RIGHT
        ===================================================== */

        .logo-icareer {

            top: 30px;

            right: 35px;

            opacity: 0;

            animation:
                fadeInCorner
                0.8s
                ease-in-out
                2.8s
                forwards;
        }


        /* =====================================================
           DIGITERA - BOTTOM LEFT
        ===================================================== */

        .logo-digitera {

            bottom: 30px;

            left: 35px;

            opacity: 0;

            animation:
                fadeInCorner
                0.8s
                ease-in-out
                3s
                forwards;
        }


        /* =====================================================
           INTRO SCREEN
        ===================================================== */

        #intro-overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: #050a18;

            display: flex;

            justify-content: center;

            align-items: center;

            z-index: 9999;

            pointer-events: none;

            animation:
                fadeOutBackground
                0.8s
                ease-in-out
                2.4s
                forwards;
        }


        /* =====================================================
           ERASOFT LOGO
           ONE LOGO ONLY
        ===================================================== */

        .erasoft-animated-logo {

            position: absolute;

            padding: 10px 18px;

            background: #FFFFFF;

            border-radius: 15px;

            box-shadow:
                0 0 35px rgba(0, 168, 204, 0.50);

            animation:
                erasoftMove
                1.8s
                cubic-bezier(0.77, 0, 0.175, 1)
                0.6s
                forwards;
        }


        .erasoft-animated-logo img {

            height: 55px;

            width: auto;

            display: block;
        }


        /* =====================================================
           ANIMATIONS
        ===================================================== */

        /* EraSoft moves from center to top-left */

        @keyframes erasoftMove {

            0% {

                transform:
                    translate(0, 0)
                    scale(1.4);
            }

            100% {

                transform:
                    translate(
                        calc(-50vw + 120px),
                        calc(-50vh + 65px)
                    )
                    scale(0.75);
            }
        }


        /* Intro background disappears */

        @keyframes fadeOutBackground {

            to {

                background: transparent;
            }
        }


        /* Main page appears */

        @keyframes fadeInCover {

            to {

                opacity: 1;
            }
        }


        /* Other logos appear */

        @keyframes fadeInCorner {

            to {

                opacity: 1;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 768px) {

            .main-title-box h1 {

                font-size: 1.7rem;
            }

            .logo-box img {

                height: 30px;
            }

            .logo-icareer {

                top: 18px;

                right: 18px;
            }

            .logo-digitera {

                bottom: 18px;

                left: 18px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         INTRO ERA SOFT
    ===================================================== -->

    <div id="intro-overlay">

        <div class="erasoft-animated-logo">

            <img
                src="Logo EraaSoft.webp"
                alt="EraSoft Logo"
            >

        </div>

    </div>


    <!-- =====================================================
         MAIN COVER
    ===================================================== -->

    <div class="cover-container">


        <!-- Background overlay -->

        <div class="cover-overlay"></div>


        <!-- =================================================
             iCAREER LOGO
        ================================================= -->

        <div class="logo-box logo-icareer">

            <img
                src="Logo icareer.webp"
                alt="iCareer Logo"
            >

        </div>


        <!-- =================================================
             DIGITERA LOGO
        ================================================= -->

        <div class="logo-box logo-digitera">

            <img
                src="Logo Digitera.png"
                alt="Digitera Logo"
            >

        </div>


        <!-- =================================================
             TITLE
        ================================================= -->

        <div class="main-title-box">

            <h1>
                Pharmacy Performance Dashboard
            </h1>

        </div>


    </div>


</body>
</html>
